<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Design System — Terrs Design</title>
  <meta name="description" content="Internal component reference for the Terrs Design portfolio.">
  <meta name="author" content="Mariateresa Busco">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ecf3f6">

  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <main class="design-system page-shell" id="main-content">
    <header class="design-system__header">
      <p class="eyebrow">Internal reference</p>
      <h1>Design system</h1>
      <p>Components are implemented from the connected Figma file.</p>
    </header>

    <section class="design-system__section" aria-labelledby="buttons-title">
      <h2 id="buttons-title">Buttons</h2>

      <div class="component-grid">
        <div class="component-example">
          <h3>Primary</h3>
          <button class="button button--primary" type="button">Button</button>
          <button class="button button--primary is-hovered" type="button">Button</button>
          <button class="button button--primary is-pressed" type="button">Button</button>
          <button class="button button--primary" type="button" aria-pressed="true">Button</button>
          <button class="button button--primary" type="button" disabled>Button</button>
        </div>

        <div class="component-example">
          <h3>Secondary</h3>
          <button class="button button--secondary" type="button">Button</button>
          <button class="button button--secondary is-hovered" type="button">Button</button>
          <button class="button button--secondary is-pressed" type="button">Button</button>
          <button class="button button--secondary" type="button" aria-pressed="true">Button</button>
          <button class="button button--secondary" type="button" disabled>Button</button>
        </div>

        <div class="component-example">
          <h3>Ghost</h3>
          <button class="button button--ghost" type="button">Button</button>
          <button class="button button--ghost is-hovered" type="button">Button</button>
          <button class="button button--ghost is-pressed" type="button">Button</button>
          <button class="button button--ghost" type="button" aria-pressed="true">Button</button>
          <button class="button button--ghost" type="button" disabled>Button</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
